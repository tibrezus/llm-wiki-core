name: "Repo Map (RIG)"
description: "Produce a Repository Intelligence Graph (rig.db, SQLite + FTS5) from the repo's build system. Query it with rig-query.py — never load the graph into context. Publishes as a Release asset for wiki consumption."

inputs:
  language:
    description: "Primary programming language (go, typescript, python, rust, ...)"
    required: true
  output:
    description: "Output file path (default: rig.db)"
    required: false
    default: "rig.db"

runs:
  using: "composite"
  steps:
    - name: Generate RIG JSON
      shell: bash
      env:
        LANGUAGE: ${{ inputs.language }}
        OUTPUT: ${{ inputs.output }}
      run: |
        # Universal emitter (emit-rig.sh → emit-rig.py). Auto-detects every build
        # system in the repo; the language input is a hint, not a dispatch key.
        # The output is the canonical rig.db — the single queryable artifact.
        EMITTER="${GITHUB_ACTION_PATH}/emit-rig.sh"
        if [ ! -f "$EMITTER" ]; then
          echo "::error::Universal RIG emitter (emit-rig.sh) not found in the action."
          exit 1
        fi
        bash "$EMITTER" "$OUTPUT" "$LANGUAGE"
        echo "Generated RIG: $OUTPUT ($(wc -c < "$OUTPUT") bytes)"
